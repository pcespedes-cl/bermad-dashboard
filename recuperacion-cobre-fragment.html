<!-- Fragmento reutilizable: insertar dentro de un dashboard mayor -->
<style>
  .rc-card{background:#fff;border:1px solid #d2d2d7;border-radius:14px;padding:16px;max-width:460px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#1d1d1f}
  .rc-card .title{font-size:15px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .rc-card .dot{width:8px;height:8px;border-radius:50%;background:#007aff}
  .rc-card .tabs{display:flex;gap:6px;margin-bottom:12px}
  .rc-card .tab{flex:1;padding:6px;border:1px solid #d2d2d7;border-radius:8px;background:#f5f5f7;cursor:pointer;font-size:12px;font-weight:500}
  .rc-card .tab.active{background:#007aff;color:#fff;border-color:#007aff}
  .rc-card .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rc-card .field{display:flex;flex-direction:column;gap:3px}
  .rc-card .field label{font-size:11px;color:#6e6e73;font-weight:500}
  .rc-card .field input{border:1px solid #d2d2d7;border-radius:8px;padding:5px 7px;font-size:12px;background:#f5f5f7}
  .rc-card .results{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .rc-card .res{background:#f5f5f7;border-radius:10px;padding:9px}
  .rc-card .res .k{font-size:10px;color:#6e6e73;text-transform:uppercase;letter-spacing:.4px}
  .rc-card .res .v{font-size:17px;font-weight:600;margin-top:2px}
  .rc-card .res .u{font-size:10px;color:#6e6e73}
  .rc-card .status{margin-top:10px;font-size:12px;padding:8px 10px;border-radius:8px;background:#f5f5f7;color:#6e6e73}
</style>
<div class="rc-card" id="rcCard">
  <h3 class="title"><span class="dot"></span>Recuperación de cobre en pilas</h3>
  <div class="tabs">
    <button class="tab active" data-mode="oxido">Óxidos</button>
    <button class="tab" data-mode="sulfuro">Sulfuros</button>
    <button class="tab" data-mode="balance">Balance</button>
  </div>
  <div class="mode" data-mode="oxido">
    <div class="grid">
      <div class="field"><label>Rmax (%)</label><input data-k="ox_Rmax" type="number" value="85"></div>
      <div class="field"><label>k (1/día)</label><input data-k="ox_k" type="number" value="0.05"></div>
      <div class="field"><label>Tiempo t (días)</label><input data-k="ox_t" type="number" value="60"></div>
      <div class="field"><label>CuS/CuT (%)</label><input data-k="ox_ratio" type="number" value="70"></div>
      <div class="field"><label>Factor escalamiento</label><input data-k="ox_factor" type="number" value="0.92"></div>
    </div>
  </div>
  <div class="mode" data-mode="sulfuro" style="display:none">
    <div class="grid">
      <div class="field"><label>R1 (%)</label><input data-k="su_R1" type="number" value="30"></div>
      <div class="field"><label>k1</label><input data-k="su_k1" type="number" value="0.08"></div>
      <div class="field"><label>R2 (%)</label><input data-k="su_R2" type="number" value="50"></div>
      <div class="field"><label>k2</label><input data-k="su_k2" type="number" value="0.01"></div>
      <div class="field"><label>Tiempo t (días)</label><input data-k="su_t" type="number" value="240"></div>
      <div class="field"><label>Factor</label><input data-k="su_factor" type="number" value="0.85"></div>
    </div>
  </div>
  <div class="mode" data-mode="balance" style="display:none">
    <div class="grid">
      <div class="field"><label>Cu PLS (t)</label><input data-k="b_pls" type="number" value="45"></div>
      <div class="field"><label>Cu Refino (t)</label><input data-k="b_ref" type="number" value="5"></div>
      <div class="field"><label>Cu Alimentado (t)</label><input data-k="b_feed" type="number" value="100"></div>
    </div>
  </div>
  <div class="results">
    <div class="res"><div class="k">Recuperación</div><div class="v" id="rc_rec">—</div><div class="u">%</div></div>
    <div class="res"><div class="k">Escalada</div><div class="v" id="rc_esc">—</div><div class="u">%</div></div>
    <div class="res"><div class="k">Techo</div><div class="v" id="rc_techo">—</div><div class="u">%</div></div>
    <div class="res"><div class="k">Balance</div><div class="v" id="rc_bal">—</div><div class="u">%</div></div>
  </div>
  <div class="status" id="rc_status">—</div>
</div>
<script>
(function(){
  const card=document.getElementById('rcCard');
  const $=k=>card.querySelector('[data-k="'+k+'"]');
  const val=k=>parseFloat($ (k).value)||0;
  let mode='oxido';
  card.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    mode=t.dataset.mode;
    card.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
    card.querySelectorAll('.mode').forEach(m=>m.style.display=m.dataset.mode===mode?'block':'none');
    calc();
  }));
  function calc(){
    let rec=0,esc=0,techo=0,bal=0;
    if(mode==='oxido'){
      const Rmax=val('ox_Rmax'),k=val('ox_k'),t=val('ox_t'),ratio=val('ox_ratio'),factor=val('ox_factor');
      rec=Rmax*(1-Math.exp(-k*t)); esc=rec*factor; techo=ratio; if(rec>ratio){rec=ratio;esc=rec*factor;}
    }else if(mode==='sulfuro'){
      const R1=val('su_R1'),k1=val('su_k1'),R2=val('su_R2'),k2=val('su_k2'),t=val('su_t'),factor=val('su_factor');
      rec=R1*(1-Math.exp(-k1*t))+R2*(1-Math.exp(-k2*t)); esc=rec*factor;
    }else{
      const pls=val('b_pls'),ref=val('b_ref'),feed=val('b_feed');
      bal=feed>0?((pls-ref)/feed)*100:0;
    }
    card.querySelector('#rc_rec').textContent=rec?rec.toFixed(1):'—';
    card.querySelector('#rc_esc').textContent=esc?esc.toFixed(1):'—';
    card.querySelector('#rc_techo').textContent=techo?techo.toFixed(1):'—';
    card.querySelector('#rc_bal').textContent=bal?bal.toFixed(1):'—';
    card.querySelector('#rc_status').textContent= mode==='oxido'?'Óxidos: cinética rápida.': mode==='sulfuro'?'Sulfuros: doble etapa.':'Balance metalúrgico.';
  }
  card.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));
  calc();
})();
</script
