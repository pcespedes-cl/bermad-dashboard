services:
  - type: web
    name: bermad-dashboard
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BERMAD_API_KEY
        sync: false
      - key: BERMAD_PROJECT_ID
        value: f09f3f01c034ad82ac311fdb3e47e391
      - key: BERMAD_UNIT_ID
        value: dcc38574-e6b8-454e-b3f3-36b1c3924264
